name: Actualizador Diario de Datos

on:
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install pandas requests

      - name: Extraer nuevos datos
        run: python main.py

      - name: Guardar CSV en el repositorio
        run: |

          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add datos_economicos.csv
          git commit -m "📊 Actualización automática diaria de datos" || echo "No hay cambios nuevos"
          git pull --rebase
          git push
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add datos_economicos.csv
          git commit -m "📊 Actualización automática diaria de datos" || echo "No hay cambios nuevos"
          git push
