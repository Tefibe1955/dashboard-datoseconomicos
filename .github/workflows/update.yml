name: Actualizador Diario de Datos

on:
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install pandas requests

      - name: Extraer nuevos datos
        run: python main.py

      - name: Guardar CSV de forma segura
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📊 Actualización automática diaria de datos"
